<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="devin jones">
  <!-- The cron asterisk. The whole site is a crontab, and in cron * means "every".
       Drawn as three crossing bars rather than a font glyph so it stays a shape at
       16px instead of turning into a letterform. Geometry is shared with the PNG
       icons and the share card - see build-assets.js, which reads this file. -->
  <rect width="64" height="64" rx="13" fill="#1F5FA8"/>
  <g stroke="#EDF0F4" stroke-width="7" stroke-linecap="round">
    <line x1="32"    y1="13"   x2="32"    y2="51"/>
    <line x1="15.55" y1="22.5" x2="48.45" y2="41.5"/>
    <line x1="15.55" y1="41.5" x2="48.45" y2="22.5"/>
  </g>
</svg>
